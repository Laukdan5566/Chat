include include.d/security-headers.conf;

# Enables response header of "Vary: Accept-Encoding"
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/xml
    application/xml+rss
    font/ttf
    font/otf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;
