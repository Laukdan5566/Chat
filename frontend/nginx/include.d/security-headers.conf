# Cabeçalhos de segurança. O nginx NÃO herda add_header de server para um location que
# define o próprio add_header: por isso este arquivo é incluído no server e em cada include
# de location que usa add_header (nocache.conf, allcache.conf).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
